[project]
name = "goodcodereview-lint"
version = "0.1.0"
description = "Run the lint rules that Good Code Review cards name as gates, report findings by card, and say how much of the card set a run covers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ruff>=0.15"]
license = "MIT"
authors = [{ name = "Pablo Jesús González Rubio", email = "contact@pablogonzalez.me" }]
keywords = ["code-review", "lint", "ruff", "checklist", "agent-skills"]
classifiers = ["Environment :: Console", "Topic :: Software Development :: Quality Assurance"]

[project.urls]
Homepage = "https://goodcodereview.com"
Source = "https://github.com/n0nuser/goodcodereview/tree/main/lint"

[project.scripts]
gcr-lint = "goodcodereview_lint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodcodereview_lint"]
