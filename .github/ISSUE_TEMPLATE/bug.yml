name: Bug
description: The tools, the build, the site, or the plugin install is broken.
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - tools/validate.py
        - tools/build.py
        - Site (goodcodereview.com)
        - Skill or plugin install
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Say what you did, what you expected, and what you got. Paste the exact command and error text.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and agent tool if relevant.
