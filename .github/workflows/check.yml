name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: uv sync --locked
      - run: npm ci
      - run: python3 tools/validate.py
      - run: python3 tools/build.py
      - run: python3 tools/agent_ready_check.py
      - name: skills/ matches the cards
        if: github.ref != 'refs/heads/main'
        run: git diff --exit-code skills/ || { echo "::error::skills/ is stale. Run 'python3 tools/build.py' and commit skills/."; exit 1; }
      - run: uv run ruff check tools test
      - run: uv run mypy
      - run: uv run pytest -q
      - run: node --test test/worker.test.mjs test/webmcp.test.mjs
      - name: Relative links and anchors resolve
        run: python3 tools/check_links.py
      - name: SBOM is current and every component has a licence
        run: uv run python tools/sbom.py --check
      - name: Accessibility check of the built site (axe-core)
        run: node test/a11y.mjs
