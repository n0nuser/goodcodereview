name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
      - run: python3 tools/build.py
      - run: python3 tools/agent_ready_check.py
      - name: skills/ matches the cards
        if: github.ref != 'refs/heads/main'
        run: git diff --exit-code skills/ || { echo "::error::skills/ is stale. Run 'python3 tools/build.py' and commit skills/."; exit 1; }
      - run: node --test test/worker.test.mjs
      - run: python3 -m unittest discover -s test
