name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
      - run: python3 tools/build.py
      - run: python3 tools/agent_ready_check.py
      - name: skills/ matches the cards
        if: github.ref != 'refs/heads/main'
        run: git diff --exit-code skills/ || { echo "::error::skills/ is stale. Run 'python3 tools/build.py' and commit skills/."; exit 1; }
      - run: node --test test/worker.test.mjs
      - run: python3 -m unittest discover -s test
